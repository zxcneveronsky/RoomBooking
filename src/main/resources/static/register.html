<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — RoomBooking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col">
<div id="appNav"></div>

<main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="animate__animated animate__fadeInUp auth-card p-6 md:p-10 w-full max-w-md shadow-lg">
        <h1 class="hero-title text-3xl sm:text-4xl font-extrabold tracking-tighter mb-2">Регистрация</h1>
        <p class="text-gray-400 font-medium mb-8">Создай аккаунт для бронирования комнат</p>

        <form id="registerForm" class="space-y-4 sm:space-y-5">
            <div>
                <label class="text-sm font-semibold text-gray-600">Email</label>
                <input type="email" id="email" required placeholder="user@example.com" class="auth-input w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none text-sm">
            </div>
            <div>
                <label class="text-sm font-semibold text-gray-600">Пароль</label>
                <input type="password" id="password" required minlength="6" placeholder="Минимум 6 символов" class="auth-input w-full mt-1.5 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none text-sm">
            </div>
            <p id="error" class="text-red-500 text-sm hidden"></p>
            <button type="submit" class="btn-apple w-full bg-blue-600 text-white font-bold py-3.5 text-base hover:bg-blue-700">Зарегистрироваться</button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-500">
                Уже есть аккаунт? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Войди</a>
            </p>
        </div>
    </div>
</main>

<script src="/js/api.js"></script>
<script>
    buildPublicNav();
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('error');
        errorEl.classList.add('hidden');
        try {
            const data = await request('/auth/register', {
                method: 'POST',
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            setToken(data.token);
            setAuthEmail(data.email);
            window.location.href = '/dashboard.html';
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
