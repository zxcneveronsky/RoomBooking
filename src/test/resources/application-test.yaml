spring:
  datasource:
    url: jdbc:h2:mem:roombooking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  cache:
    type: caffeine
    cache-names: rooms, bookings, users
    caffeine:
      spec: maximumSize=500,expireAfterAccess=1h

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-1234
  expiration: 86400000

logging:
  level:
    root: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    com.example.roombooking: DEBUG
